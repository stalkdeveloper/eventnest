{% extends 'base.html' %}
{% block title %}500 - EventNest{% endblock %}
{% block content %}
<div style="min-height:65vh;display:flex;align-items:center;justify-content:center;text-align:center">
  <div>
    <div style="font-size:5rem;margin-bottom:1rem">&#9889;</div>
    <div style="font-family:var(--font-head);font-size:6rem;font-weight:800;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:1rem">500</div>
    <h2 style="font-family:var(--font-head);font-size:1.75rem;margin-bottom:.75rem">Server Error</h2>
    <p style="color:var(--text2);font-size:1rem;max-width:420px;margin:0 auto 2.5rem;line-height:1.7">Something went wrong on our end. We're working on it.</p>
    <div style="display:flex;gap:1rem;justify-content:center">
      <a href="/" class="btn btn-gradient btn-lg">Go Home</a>
      <a href="javascript:history.back()" class="btn btn-outline btn-lg">Go Back</a>
    </div>
  </div>
</div>
{% endblock %}
