{% extends 'base.html' %}
{% block title %}Check Your Email — EventNest{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <h2 class="auth-title">Check Your Email ✉️</h2>
    <p class="auth-sub text-muted">
      We've sent password reset instructions to your email address.
      If you don't see it, check your spam folder.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-gradient btn-w-full mt-2">Back to Login</a>
  </div>
</div>
{% endblock %}
