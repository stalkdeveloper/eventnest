<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>{% block title %}EventNest{% endblock %}</title>

  {% load static %}

  <!-- Fonts: Space Grotesk (display/headings) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Icons (same as admin) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- App CSS -->
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

  {% block extra_css %}{% endblock %}
</head>

<body>

  {% include 'web/partials/navbar.html' %}

  {% if messages %}
  <div class="alerts">
    {% for msg in messages %}
    <div class="alert alert-{% if msg.tags == 'error' %}error{% elif msg.tags == 'success' %}success{% elif msg.tags == 'warning' %}warning{% else %}info{% endif %}">
      {{ msg }}
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  {% include 'web/partials/footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
  {% block extra_js %}{% endblock %}

</body>
</html>
