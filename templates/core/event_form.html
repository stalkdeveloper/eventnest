{% extends 'base.html' %}
{% block title %}{{ action }} Event - EventNest{% endblock %}
{% block content %}
<div style="max-width:800px;margin:0 auto">
  <h1 class="section-title">{{ action }} Event</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="card mb-3">
      <div class="card-body">
        <h3 style="font-family:var(--font-head);margin-bottom:1.25rem;color:var(--text2);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em">Basic Info</h3>
        <div class="form-group">
          <label class="form-label">Event Title *</label>
          <input type="text" name="title" value="{{ event.title|default:'' }}" class="form-input" required placeholder="Give your event a great title">
        </div>
        <div class="form-group">
          <label class="form-label">Description *</label>
          <textarea name="description" rows="5" class="form-input" required placeholder="Describe your event in detail...">{{ event.description|default:'' }}</textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem">
          <div class="form-group">
            <label class="form-label">Event Type</label>
            <select name="event_type" class="form-input form-select">
              <option value="offline" {% if event.event_type == 'offline' %}selected{% endif %}>Offline</option>
              <option value="online" {% if event.event_type == 'online' %}selected{% endif %}>Online</option>
              <option value="hybrid" {% if event.event_type == 'hybrid' %}selected{% endif %}>Hybrid</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <select name="category" class="form-input form-select">
              <option value="">Select category</option>
              {% for cat in categories %}
              <option value="{{ cat.id }}" {% if event.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <h3 style="font-family:var(--font-head);margin-bottom:1.25rem;color:var(--text2);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em">Date & Location</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem">
          <div class="form-group">
            <label class="form-label">Start Date & Time *</label>
            <input type="datetime-local" name="start_date" value="{{ event.start_date|date:'Y-m-d\TH:i'|default:'' }}" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">End Date & Time *</label>
            <input type="datetime-local" name="end_date" value="{{ event.end_date|date:'Y-m-d\TH:i'|default:'' }}" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">City</label>
            <input type="text" name="city" value="{{ event.city|default:'' }}" class="form-input" placeholder="City name">
          </div>
          <div class="form-group">
            <label class="form-label">Venue Name</label>
            <input type="text" name="venue" value="{{ event.venue|default:'' }}" class="form-input" placeholder="Venue or hall name">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Full Address</label>
          <textarea name="address" rows="2" class="form-input" placeholder="Full address">{{ event.address|default:'' }}</textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Online Meeting Link</label>
          <input type="url" name="online_link" value="{{ event.online_link|default:'' }}" class="form-input" placeholder="https://zoom.us/...">
        </div>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <h3 style="font-family:var(--font-head);margin-bottom:1.25rem;color:var(--text2);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em">Tickets & Capacity</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.25rem">
          <div class="form-group">
            <label class="form-label">Max Capacity (0 = unlimited)</label>
            <input type="number" name="max_capacity" value="{{ event.max_capacity|default:0 }}" class="form-input" min="0">
          </div>
          <div class="form-group">
            <label class="form-label">Ticket Price (&#8377;)</label>
            <input type="number" name="ticket_price" value="{{ event.ticket_price|default:0 }}" class="form-input" min="0" step="0.01">
          </div>
          <div class="form-group">
            <label class="form-label">Free Event?</label>
            <div style="display:flex;align-items:center;gap:.75rem;margin-top:.75rem">
              <input type="checkbox" name="is_free" id="is_free" {% if event.is_free or not event %}checked{% endif %} style="width:18px;height:18px;accent-color:var(--accent2)">
              <label for="is_free" style="font-size:.9rem">Mark as free event</label>
            </div>
          </div>
        </div>
        {% if action == 'Edit' %}
        <div class="form-group">
          <label class="form-label">Status</label>
          <select name="status" class="form-input form-select">
            <option value="draft" {% if event.status == 'draft' %}selected{% endif %}>Draft</option>
            <option value="published" {% if event.status == 'published' %}selected{% endif %}>Published</option>
            <option value="cancelled" {% if event.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
            <option value="completed" {% if event.status == 'completed' %}selected{% endif %}>Completed</option>
          </select>
        </div>
        {% endif %}
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <h3 style="font-family:var(--font-head);margin-bottom:1.25rem;color:var(--text2);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em">Banner Image</h3>
        <div class="form-group">
          <label class="form-label">Upload Banner (optional)</label>
          <input type="file" name="banner" accept="image/*" class="form-input">
        </div>
      </div>
    </div>

    <div class="flex gap-2">
      <button type="submit" class="btn btn-gradient btn-lg">{{ action }} Event</button>
      <a href="{% url 'core:organiser_dashboard' %}" class="btn btn-outline btn-lg">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
