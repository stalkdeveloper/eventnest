<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body{font-family:Arial,sans-serif;color:#1a1a1a;background:#f5f5f5;margin:0;padding:0}
    .container{max-width:600px;margin:40px auto;background:#fff;border-radius:12px;overflow:hidden}
    .header{background:linear-gradient(135deg,#7c3aed,#4f46e5);padding:32px 40px}
    .header h1{color:#fff;margin:0;font-size:24px}
    .body{padding:32px 40px}
    .footer{background:#f9f9f9;padding:16px 40px;font-size:12px;color:#888;border-top:1px solid #eee}
    .btn{display:inline-block;background:#7c3aed;color:#fff!important;padding:12px 28px;border-radius:8px;text-decoration:none;font-weight:bold;margin:16px 0}
    .ticket-box{background:#f3f0ff;border:2px dashed #7c3aed;border-radius:8px;padding:16px 24px;margin:16px 0;text-align:center}
    .ticket-code{font-size:24px;font-weight:bold;color:#7c3aed;letter-spacing:2px}
    .info-row{display:flex;gap:8px;margin:8px 0;font-size:14px}
    .label{color:#888;min-width:80px}
  </style>
</head>
<body>
<div class="container">
  <div class="header"><h1>⬡ EventNest</h1></div>
  <div class="body">{% block content %}{% endblock %}</div>
  <div class="footer">© EventNest · <a href="{{ site_url }}">{{ site_url }}</a></div>
</div>
</body>
</html>
