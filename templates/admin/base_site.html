{% extends "admin/base.html" %}
{% block title %}{{ title }} | EventNest Admin{% endblock %}
{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}">&#11043; EventNest Admin</a></h1>
{% endblock %}
{% block extrastyle %}
{{ block.super }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5ff; --bg2:#eceeff; --card:#fff; --card2:#f8f9ff;
  --border:#dde0ff; --text:#1a1a2e; --text2:#5a5a8a;
  --accent:#5b5fcf; --accent2:#7c7ff5; --accent3:#a5a8ff;
  --grad:linear-gradient(90deg,#CAD0FF,#E3E3E3);
  --green:#16a34a; --red:#dc2626; --orange:#d97706;
}
*{font-family:'DM Sans',sans-serif!important;box-sizing:border-box}
body,#container,#content-main,#content,.module{background:var(--bg)!important;color:var(--text)!important}

/* Header */
#header{
  background:var(--grad)!important;
  padding:0 1.5rem!important; height:60px!important;
  display:flex!important; align-items:center!important;
  justify-content:space-between!important;
  border-bottom:1px solid var(--border)!important;
  box-shadow:0 2px 16px rgba(91,95,207,.12)!important;
}
#branding h1,#branding h1 a{
  font-family:'Syne',sans-serif!important;
  font-size:1.3rem!important; font-weight:800!important;
  color:var(--accent)!important; letter-spacing:-.5px!important;
}
#user-tools{color:var(--text2)!important;font-size:.85rem!important}
#user-tools a{color:var(--accent)!important;font-weight:600!important}
#user-tools a:hover{color:var(--accent2)!important}

/* Breadcrumbs */
div.breadcrumbs{
  background:var(--card)!important;
  border-bottom:1px solid var(--border)!important;
  padding:.65rem 1.5rem!important;
  color:var(--text2)!important; font-size:.85rem!important;
}
div.breadcrumbs a{color:var(--accent)!important}

/* Sidebar */
#nav-sidebar{background:var(--card)!important;border-right:1px solid var(--border)!important}
#nav-sidebar .current-app .section:link,
#nav-sidebar .current-app .section:visited{color:var(--accent)!important;font-weight:700!important}

/* Modules */
.module{
  background:var(--card)!important;
  border:1px solid var(--border)!important;
  border-radius:12px!important; overflow:hidden!important;
  margin-bottom:1.5rem!important;
  box-shadow:0 2px 12px rgba(91,95,207,.07)!important;
}
.module h2,.module caption{
  background:var(--grad)!important;
  color:var(--accent)!important;
  border-bottom:1px solid var(--border)!important;
  font-family:'Syne',sans-serif!important; font-weight:700!important;
  padding:.85rem 1.25rem!important; font-size:.88rem!important;
  text-transform:uppercase!important; letter-spacing:.04em!important;
}
#content-main{padding:1.5rem!important}
#content{padding:0!important;background:var(--bg)!important}

/* Table */
.change-list .results table,.results table{
  border:1px solid var(--border)!important;
  border-radius:10px!important; overflow:hidden!important;
  background:var(--card)!important;
}
#result_list thead th,#result_list thead th a{
  background:var(--bg2)!important; color:var(--text2)!important;
  font-size:.77rem!important; text-transform:uppercase!important;
  letter-spacing:.05em!important; border:none!important;
  padding:.8rem 1rem!important; font-weight:700!important;
}
#result_list tbody tr{background:var(--card)!important;border-bottom:1px solid var(--border)!important}
#result_list tbody tr:hover{background:var(--bg2)!important}
#result_list tbody td,#result_list tbody th{
  padding:.85rem 1rem!important; border:none!important;
  font-size:.88rem!important; color:var(--text)!important;
}

/* Links */
a:link,a:visited{color:var(--accent)!important}
a:hover{color:var(--accent2)!important}

/* Submit row */
.submit-row{
  background:var(--bg2)!important;
  border-top:1px solid var(--border)!important;
  padding:1rem 1.25rem!important;
}
.submit-row input,.button,.historylink a,.deletelink,.addlink{
  border-radius:8px!important; font-size:.88rem!important;
  font-weight:600!important; padding:.55rem 1.2rem!important;
  border:none!important; cursor:pointer!important;
  transition:all .2s!important;
}
input[type=submit],input[type=button],.default{
  background:var(--grad)!important;
  color:var(--accent)!important;
  border:1px solid var(--border)!important;
}
input[type=submit]:hover{box-shadow:0 4px 16px rgba(91,95,207,.2)!important}
.deletelink{
  background:#fee2e2!important; color:var(--red)!important;
  border:1px solid #fca5a5!important;
}

/* Form inputs */
input[type=text],input[type=email],input[type=password],
input[type=number],input[type=url],select,textarea{
  background:var(--bg2)!important; border:1px solid var(--border)!important;
  color:var(--text)!important; border-radius:8px!important;
  padding:.65rem 1rem!important; font-size:.9rem!important;
  outline:none!important; transition:border-color .2s!important;
  width:100%!important;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent2)!important;
  box-shadow:0 0 0 3px rgba(124,127,245,.12)!important;
}

/* Form rows */
.form-row{padding:1rem 1.25rem!important;border-bottom:1px solid var(--border)!important}
.form-row:last-child{border-bottom:none!important}
label{color:var(--text2)!important;font-size:.83rem!important;font-weight:600!important;text-transform:uppercase!important;letter-spacing:.03em!important}
.help{color:var(--text2)!important;font-size:.78rem!important}

/* Errors */
.errornote,.errorlist li{
  background:#fee2e2!important; border:1px solid #fca5a5!important;
  color:var(--red)!important; border-radius:6px!important;
  padding:.5rem .85rem!important;
}

/* Messages */
.messagelist li{
  border-radius:8px!important; padding:.75rem 1rem!important;
  margin-bottom:.5rem!important; font-size:.88rem!important;
}
.messagelist li.success{background:#dcfce7!important;color:var(--green)!important;border:1px solid #86efac!important}
.messagelist li.warning{background:#fef3c7!important;color:var(--orange)!important;border:1px solid #fcd34d!important}
.messagelist li.error{background:#fee2e2!important;color:var(--red)!important;border:1px solid #fca5a5!important}

/* Filters */
#changelist-filter{background:var(--card)!important;border-left:1px solid var(--border)!important}
#changelist-filter h2{background:var(--bg2)!important;color:var(--text)!important;border-bottom:1px solid var(--border)!important}
#changelist-filter ul li a{color:var(--text2)!important}
#changelist-filter ul li.selected a{color:var(--accent)!important;font-weight:700!important}

/* Paginator */
.paginator{color:var(--text2)!important}
.paginator a{color:var(--accent)!important}

/* Dashboard specific */
.dashboard #content{padding:1.5rem!important}
#nav-sidebar .module{border-radius:8px!important;margin:0 .5rem .5rem!important}

/* Checkbox */
input[type=checkbox]{accent-color:var(--accent)!important;width:16px!important;height:16px!important}
</style>
{% endblock %}
